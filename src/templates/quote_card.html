<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Card</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;600&family=Playfair+Display:ital,wght@1,400;1,700&display=swap');

        body {
            margin: 0;
            padding: 0;
            width: 1080px;
            height: 1080px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            font-family: 'Outfit', sans-serif;
            color: white;
            overflow: hidden;
        }

        .card-container {
            position: relative;
            width: 850px;
            height: 850px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Abstract Background blobs */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            animation: float 10s infinite ease-in-out;
        }
        .blob-1 { width: 400px; height: 400px; background: #7c3aed; top: -50px; left: -50px; }
        .blob-2 { width: 350px; height: 350px; background: #ec4899; bottom: -50px; right: -50px; animation-delay: -2s; }
        .blob-3 { width: 300px; height: 300px; background: #3b82f6; top: 40%; left: 40%; animation-delay: -4s; opacity: 0.4; }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(20px, -20px) scale(1.1); }
        }

        /* Glassmorphism Card */
        .card {
            position: relative;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 80px;
            box-sizing: border-box;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .quote-symbol {
            font-family: 'Playfair Display', serif;
            font-size: 120px;
            color: rgba(255, 255, 255, 0.2);
            position: absolute;
            top: 40px;
            left: 60px;
            line-height: 1;
        }

        .content {
            z-index: 10;
            text-align: center;
        }

        .text {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 56px;
            line-height: 1.3;
            font-weight: 500;
            margin-bottom: 40px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .author {
            font-family: 'Outfit', sans-serif;
            font-size: 28px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 4px;
            position: relative;
            display: inline-block;
            color: rgba(255, 255, 255, 0.9);
        }

        .author::before {
            content: '';
            position: absolute;
            top: 50%;
            left: -60px;
            width: 40px;
            height: 2px;
            background: rgba(255, 255, 255, 0.5);
        }
        
        .author::after {
            content: '';
            position: absolute;
            top: 50%;
            right: -60px;
            width: 40px;
            height: 2px;
            background: rgba(255, 255, 255, 0.5);
        }
        
        .footer {
            position: absolute;
            bottom: 40px;
            font-size: 16px;
            opacity: 0.5;
            letter-spacing: 2px;
        }

    </style>
</head>
<body>
    
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="card-container">
        <div class="card">
            <div class="quote-symbol">“</div>
            <div class="content">
                <div class="text">
                    {{ quote }}
                </div>
                <div class="author">
                    {{ author }}
                </div>
            </div>
            <div class="footer">IEMA</div>
        </div>
    </div>

</body>
</html>
